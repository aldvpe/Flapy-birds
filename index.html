<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
  <canvas id="birdCanvas" width="360" height="500"></canvas>

  <!-- Start Menu -->
  <div id="start-screen" class="screen">
    <h2>Flappy Bird</h2>
    <p style="margin-bottom: 15px; font-size: 12px;">Masukkan data untuk bermain</p>
    <input type="text" id="username" placeholder="Username" required>
    <input type="tel" id="whatsapp" placeholder="Nomor WA (08xxx)" required>
    <button onclick="startGame()">Mulai Game</button>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over-screen" class="screen hidden">
    <h2>Game Over!</h2>
    <p>Skor Anda: <span id="final-score">0</span></p>
    <p id="status-msg" style="font-size: 12px; color: #ffeb3b; margin-top: 5px;"></p>
    
    <h3 style="margin-top: 15px;">Top 5 Leaderboard</h3>
    <table class="leaderboard-table">
      <thead>
        <tr><th>Rank</th><th>Nama</th><th>Skor</th></tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="3">Memuat...</td></tr>
      </tbody>
    </table>
    
    <button onclick="restartGame()">Main Lagi</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
