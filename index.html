<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Leaderboard Google Sheets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="360" height="640"></canvas>

    <!-- Menu Awal -->
    <div id="start-screen" class="screen">
        <div class="logo-container">
            <div class="bird-logo"></div>
            <h1>FLAPPY BIRD</h1>
        </div>
        <p class="subtitle">Masukan identitas sebelum bermain!</p>
        <div class="form-group">
            <input type="text" id="username" placeholder="Username / Nama Panggilan" required autocomplete="off">
            <input type="tel" id="noWA" placeholder="Nomor WhatsApp (08xxxxxxxx)" required autocomplete="off">
        </div>
        <button id="btn-start" onclick="startGame()">Mulai Terbang 🚀</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen" style="display: none;">
        <h2>GAME OVER</h2>
        <div class="score-card">
            <p>Skor Anda</p>
            <span id="final-score">0</span>
        </div>
        <div id="leaderboard-list">
            <p class="loading-text">Memuat Leaderboard...</p>
        </div>
        <button id="btn-restart" onclick="restartGame()">Main Lagi 🔄</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
